[package]
name = "thps2-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
viewer = ["bevy/bevy_asset", "bevy/bevy_core_pipeline", "bevy/bevy_pbr", "bevy/bevy_render", "bevy/bevy_sprite", "bevy/bevy_sprite_render", "bevy/bevy_log", "bevy/bevy_winit", "bevy/png", "bevy/x11"]

[dependencies]
thps2-data = { path = "../thps2-data" }
sha2.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
